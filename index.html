<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lade Wedding App...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
        <p>Verbindung zur Wedding App wird hergestellt...</p>
    </div>

    <script>
       (function() {
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;
    
    var appScheme = "weddingapp://auth?code=MA2026WEDDING"; 
    var testFlightUrl = "https://github.com/lucashoeglinger/WeddingPhotoApp/releases/tag/v1-ios"; 
    var gitHubUrl = "https://github.com/lucashoeglinger/WeddingPhotoApp/releases/tag/Android"; 

    var isAndroid = /android/i.test(userAgent);
    var isIOS = /iPad|iPhone|iPod/.test(userAgent) || 
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isAndroid) {
        window.location.href = appScheme;
        setTimeout(function() {
            window.location.href = gitHubUrl;
        }, 1500);
    } else if (isIOS) {
        window.location.href = appScheme;
        setTimeout(function() {
            window.location.href = testFlightUrl;
        }, 1500);
    } else {
        // Desktop / unrecognized device
        // Redirect to a landing page or prompt user instead of assuming Android:
        document.body.innerHTML = `
            <h2>Wedding App</h2>
            <p>Please open this link on your mobile phone or choose a download:</p>
            <p><a href="${testFlightUrl}">Download for iOS</a></p>
            <p><a href="${gitHubUrl}">Download for Android</a></p>
        `;
    }
})();
    </script>
</body>
</html>
