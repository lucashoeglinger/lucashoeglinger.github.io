<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lade Wedding App...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
        <p>Verbindung zur Wedding App wird hergestellt...</p>
    </div>

    <script>
        (function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            var urlParams = new URLSearchParams(window.location.search);
            var currentPassword = urlParams.get('code');
            
            if (currentPassword) {
                localStorage.setItem('wedding_password', currentPassword);
            } else {
                currentPassword = localStorage.getItem('wedding_password') || '';
            }

            if (currentPassword) {
                document.getElementById('display-password').innerText = currentPassword;
            }
            
            var baseScheme = "weddingapp://auth"; 
            var testFlightUrl = "https://apple.com"; 
            var gitHubUrl = "https://github.com/lucashoeglinger/WeddingPhotoApp/releases/tag/Android"; 

            var appScheme = currentPassword ? baseScheme + "?code=" + encodeURIComponent(currentPassword) : baseScheme;

            window.location.href = appScheme;
            
            setTimeout(function() {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('fallback-state').classList.remove('hidden');
                
                if (/android/i.test(userAgent)) {
                    window.location.href = gitHubUrl;
                } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    window.location.href = testFlightUrl;
                } else {
                    window.location.href = gitHubUrl;
                }
            }, 1500);
        })();
    </script>
</body>
</html>
